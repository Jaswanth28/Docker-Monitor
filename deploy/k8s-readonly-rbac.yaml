# Read-only (plus optional write) RBAC for Docker Monitor Kubernetes access.
# Prefer this over mounting cluster-admin rke2.yaml into the dashboard.
#
# Apply:
#   kubectl apply -f deploy/k8s-readonly-rbac.yaml
# Then create a kubeconfig for the ServiceAccount (or use in-cluster if the
# dashboard itself runs as this SA).

apiVersion: v1
kind: Namespace
metadata:
  name: docker-monitor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docker-monitor
  namespace: docker-monitor
---
# Cluster-wide read for inventory + metrics-server
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docker-monitor-read
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - pods/log
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - secrets
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: docker-monitor-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: docker-monitor-read
subjects:
  - kind: ServiceAccount
    name: docker-monitor
    namespace: docker-monitor
---
# Optional admin actions used by the dashboard (delete pod / scale / restart).
# Omit this binding if you want a read-only viewer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: docker-monitor-write
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: docker-monitor-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: docker-monitor-write
subjects:
  - kind: ServiceAccount
    name: docker-monitor
    namespace: docker-monitor
